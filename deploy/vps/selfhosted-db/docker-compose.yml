services:
  postgres:
    image: postgres:17-bookworm
    container_name: imds-postgres
    restart: unless-stopped
    env_file:
      - /etc/imds-postgres.env
    environment:
      POSTGRES_DB: imds_marketing
      POSTGRES_USER: imds_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /var/lib/imds-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imds_owner -d imds_marketing"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - imds-db

  postgrest:
    image: postgrest/postgrest:v14.16
    container_name: imds-postgrest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - /etc/imds-postgres.env
    environment:
      PGRST_DB_URI: postgres://imds_api:${IMDS_API_PASSWORD}@postgres:5432/imds_marketing
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: service_role
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}
      PGRST_SERVER_HOST: 0.0.0.0
      PGRST_SERVER_PORT: 3000
      # PostgREST is a GHC/Haskell binary. On this VPS the runtime was trying
      # to create more OS capability threads than the host/container allows,
      # causing a crash loop before port 3000 opened. One capability is more
      # than sufficient for this internal-only data API.
      GHCRTS: -N1
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - imds-db

networks:
  imds-db:
    name: imds-db
