server {
    listen 127.0.0.1:3002;
    server_name localhost;

    location = /rest/v1 {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
    }

    location /rest/v1/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name imds.duckdns.org;

    client_max_body_size 50m;

    root /var/www/imds-marketing/current;
    index index.html;

    # Payment provider callbacks are processed by the central Control Center
    # billing engine. This explicit location takes precedence over /api/.
    location /api/webhooks/cloudpayments/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Cloud PBX callback URLs include a tenant-specific webhook token. Do not
    # persist the request URI/query string in nginx access logs.
    location ~ ^/api/telephony/(binotel|sipuni)/webhook/ {
        access_log off;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Vite assets are content-hashed, so they can be cached aggressively.
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Never keep the SPA entry document stale. Every navigation should
    # revalidate index.html and receive the newest hashed asset references.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
