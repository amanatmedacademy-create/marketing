apiVersion: v1
kind: Namespace
metadata: { name: imds-marketing }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: analytics-config, namespace: imds-marketing }
data:
  NODE_ENV: production
  PORT: "3000"
  DATABASE_SSL: "true"
  CLICKHOUSE_DATABASE: analytics
  SYNC_CONCURRENCY: "12"
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: marketing-api, namespace: imds-marketing }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: marketing-api, namespace: imds-marketing }
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector: { matchLabels: { app: marketing-api } }
  template:
    metadata: { labels: { app: marketing-api } }
    spec:
      serviceAccountName: marketing-api
      containers:
        - name: api
          image: ghcr.io/amanatmedacademy-create/marketing-api:latest
          ports: [{ name: http, containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: analytics-config }
            - secretRef: { name: analytics-secrets }
          readinessProbe: { httpGet: { path: /api/health, port: http }, initialDelaySeconds: 10 }
          livenessProbe: { httpGet: { path: /api/health, port: http }, initialDelaySeconds: 30 }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata: { name: marketing-api, namespace: imds-marketing }
spec:
  selector: { app: marketing-api }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: connector-sync-worker, namespace: imds-marketing }
spec:
  replicas: 2
  selector: { matchLabels: { app: connector-sync-worker } }
  template:
    metadata: { labels: { app: connector-sync-worker } }
    spec:
      containers:
        - name: worker
          image: ghcr.io/amanatmedacademy-create/marketing-sync-worker:latest
          envFrom:
            - configMapRef: { name: analytics-config }
            - secretRef: { name: analytics-secrets }
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: marketing-api, namespace: imds-marketing }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: marketing-api }
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: marketing-api
  namespace: imds-marketing
  annotations: { cert-manager.io/cluster-issuer: letsencrypt-prod }
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.marketing.imds24.com]
      secretName: marketing-api-tls
  rules:
    - host: api.marketing.imds24.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: marketing-api, port: { name: http } } }
