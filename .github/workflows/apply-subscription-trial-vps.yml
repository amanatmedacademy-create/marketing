name: Apply Subscription Trial VPS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260818023000_marketing_product_trial.sql'
      - '.github/workflows/apply-subscription-trial-vps.yml'

permissions:
  contents: read

concurrency:
  group: apply-subscription-trial-vps
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - name: Validate deployment access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo 'VPS_HOST secret is missing'; exit 1; }
          test -n "$VPS_USER" || { echo 'VPS_USER secret is missing'; exit 1; }
          test -n "$VPS_PASSWORD" || { echo 'VPS_PASSWORD secret is missing'; exit 1; }
          command -v sshpass >/dev/null || { echo 'sshpass is unavailable on the runner'; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload trial migration
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          sshpass -e scp "${SSH_ARGS[@]}" \
            supabase/migrations/20260818023000_marketing_product_trial.sql \
            "$VPS_USER@$VPS_HOST:/tmp/20260818023000_marketing_product_trial.sql"

      - name: Discover database, apply migration and verify
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" '
            set -euo pipefail

            database=""
            container=""
            mode=""

            if sudo -u postgres psql -At -d postgres -c "select 1" >/dev/null 2>&1; then
              while IFS= read -r candidate; do
                test -n "$candidate" || continue
                has_companies=$(sudo -u postgres psql -At -d "$candidate" -c "select (to_regclass('"'"'public.crm_companies'"'"') is not null)::int" 2>/dev/null || true)
                if test "$has_companies" = "1"; then
                  database="$candidate"
                  mode="host"
                  break
                fi
              done < <(sudo -u postgres psql -At -d postgres -c "select datname from pg_database where datallowconn and not datistemplate order by datname")
            fi

            if test -z "$database" && command -v docker >/dev/null 2>&1; then
              while IFS= read -r candidate_container; do
                test -n "$candidate_container" || continue
                if ! sudo docker exec -u postgres "$candidate_container" psql -At -d postgres -c "select 1" >/dev/null 2>&1; then
                  continue
                fi
                while IFS= read -r candidate_database; do
                  test -n "$candidate_database" || continue
                  has_companies=$(sudo docker exec -u postgres "$candidate_container" psql -At -d "$candidate_database" -c "select (to_regclass('"'"'public.crm_companies'"'"') is not null)::int" 2>/dev/null || true)
                  if test "$has_companies" = "1"; then
                    container="$candidate_container"
                    database="$candidate_database"
                    mode="docker"
                    break 2
                  fi
                done < <(sudo docker exec -u postgres "$candidate_container" psql -At -d postgres -c "select datname from pg_database where datallowconn and not datistemplate order by datname")
              done < <(sudo docker ps --format "{{.ID}}")
            fi

            test -n "$database" || {
              echo "Could not find the Marketing PostgreSQL database containing public.crm_companies on host PostgreSQL or Docker PostgreSQL containers"
              exit 1
            }
            echo "Marketing database resolved via $mode: $database"

            if test "$mode" = "host"; then
              sudo -u postgres psql -v ON_ERROR_STOP=1 -d "$database" -f /tmp/20260818023000_marketing_product_trial.sql
              table_ok=$(sudo -u postgres psql -At -d "$database" -c "select (to_regclass('"'"'public.imds_product_trial_access'"'"') is not null)::int")
              function_ok=$(sudo -u postgres psql -At -d "$database" -c "select (to_regprocedure('"'"'public.imds_marketing_trial_state(uuid)'"'"') is not null)::int")
              trigger_ok=$(sudo -u postgres psql -At -d "$database" -c "select (exists (select 1 from pg_trigger where tgname = '"'"'crm_companies_create_marketing_trial'"'"' and not tgisinternal))::int")
            else
              sudo docker cp /tmp/20260818023000_marketing_product_trial.sql "$container:/tmp/20260818023000_marketing_product_trial.sql"
              sudo docker exec -u postgres "$container" psql -v ON_ERROR_STOP=1 -d "$database" -f /tmp/20260818023000_marketing_product_trial.sql
              table_ok=$(sudo docker exec -u postgres "$container" psql -At -d "$database" -c "select (to_regclass('"'"'public.imds_product_trial_access'"'"') is not null)::int")
              function_ok=$(sudo docker exec -u postgres "$container" psql -At -d "$database" -c "select (to_regprocedure('"'"'public.imds_marketing_trial_state(uuid)'"'"') is not null)::int")
              trigger_ok=$(sudo docker exec -u postgres "$container" psql -At -d "$database" -c "select (exists (select 1 from pg_trigger where tgname = '"'"'crm_companies_create_marketing_trial'"'"' and not tgisinternal))::int")
              sudo docker exec "$container" rm -f /tmp/20260818023000_marketing_product_trial.sql || true
            fi

            test "$table_ok" = "1" || { echo "trial table missing"; exit 1; }
            test "$function_ok" = "1" || { echo "trial state function missing"; exit 1; }
            test "$trigger_ok" = "1" || { echo "trial trigger missing"; exit 1; }
            echo "table:ok function:ok trigger:ok"
          '

      - name: Cleanup
        if: always()
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set +e
          export SSHPASS
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "$VPS_USER@$VPS_HOST" 'rm -f /tmp/20260818023000_marketing_product_trial.sql' || true
