name: Apply BELES branding

on:
  push:
    branches: [agent/beles-branding]
    paths:
      - scripts/apply-beles-branding.mjs
      - .github/workflows/apply-beles-branding.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/beles-branding
          fetch-depth: 0

      - name: Apply branding
        run: node scripts/apply-beles-branding.mjs

      - name: Remove temporary automation
        run: rm scripts/apply-beles-branding.mjs .github/workflows/apply-beles-branding.yml

      - name: Commit branding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: rebrand product to BELES"
          git push origin HEAD:agent/beles-branding
