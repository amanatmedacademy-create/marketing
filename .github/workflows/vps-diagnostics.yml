name: VPS Diagnostics

on:
  push:
    branches: [main]
    paths: ['.github/workflows/vps-diagnostics.yml']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - name: Validate VPS access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_PASSWORD"

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Inspect backend after PostgREST recovery
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" '
            set -u
            echo "=== PostgREST status ==="
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" | grep -E "NAMES|imds-postgrest|imds-postgres" || true
            echo "=== backend before restart ==="
            systemctl status imds-marketing.service --no-pager -l || true
            systemctl restart imds-marketing.service || true
            sleep 5
            echo "=== backend after restart ==="
            systemctl status imds-marketing.service --no-pager -l || true
            echo "=== backend journal ==="
            journalctl -u imds-marketing.service -n 100 --no-pager -o cat || true
            echo "=== port 8787 ==="
            ss -ltnp | grep ':8787' || true
            echo "=== auth config direct ==="
            curl -sS -D - -o /tmp/auth-config http://127.0.0.1:8787/api/auth/config || true
            cat /tmp/auth-config 2>/dev/null || true
            echo
            echo "=== local DB env presence ==="
            grep -q '^IMDS_LOCAL_DB_URL=' /etc/imds-marketing.env && echo IMDS_LOCAL_DB_URL=present || echo IMDS_LOCAL_DB_URL=missing
            grep -q '^IMDS_LOCAL_SERVICE_ROLE_KEY=' /etc/imds-marketing.env && echo IMDS_LOCAL_SERVICE_ROLE_KEY=present || echo IMDS_LOCAL_SERVICE_ROLE_KEY=missing
          '

      - name: Verify native auth through nginx
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl --fail --silent --show-error --max-time 15 "http://$VPS_HOST/api/auth/config")"
          echo "$BODY" | grep -q '"nativeAuth":true'
          echo "Native auth endpoint works through nginx."
