name: VPS Diagnostics

on:
  push:
    branches: [main]
    paths: ['.github/workflows/vps-diagnostics.yml']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - name: Validate VPS access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_PASSWORD"

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Recover PostgREST
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            echo "=== host resource limits ==="
            free -h || true
            printf "threads="; ps -eLf | wc -l || true
            printf "ulimit_nproc="; ulimit -u || true
            printf "kernel_threads_max="; cat /proc/sys/kernel/threads-max || true
            printf "cgroup_pids_max="; cat /sys/fs/cgroup/pids.max 2>/dev/null || true
            printf "docker_tasks_max="; systemctl show docker -p TasksMax --value || true

            set -a
            . /etc/imds-postgres.env
            set +a
            test -n "${POSTGRES_PASSWORD:-}"
            test -n "${IMDS_API_PASSWORD:-}"
            test -n "${PGRST_JWT_SECRET:-}"
            test -n "${LOCAL_SERVICE_ROLE_KEY:-}"

            cd /opt/imds-db
            if grep -q "GHCRTS:" docker-compose.yml; then
              sed -i "s/^[[:space:]]*GHCRTS:.*/      GHCRTS: -N1/" docker-compose.yml
            else
              sed -i "/PGRST_SERVER_PORT: 3000/a\      GHCRTS: -N1" docker-compose.yml
            fi

            if docker compose version >/dev/null 2>&1; then
              docker compose up -d postgres
              docker compose up -d --force-recreate postgrest
            else
              docker-compose up -d postgres
              docker-compose up -d --force-recreate postgrest
            fi

            for attempt in $(seq 1 30); do
              if curl -fsS -H "Authorization: Bearer $LOCAL_SERVICE_ROLE_KEY" http://127.0.0.1:3001/ >/dev/null 2>&1; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "=== postgrest logs after constrained restart ==="
                docker logs --tail 160 imds-postgrest 2>&1 || true
                exit 1
              fi
              sleep 2
            done

            echo "=== direct PostgREST OK ==="
            curl -fsS -H "Authorization: Bearer $LOCAL_SERVICE_ROLE_KEY" http://127.0.0.1:3001/ >/dev/null
            echo "=== compatibility proxy OK ==="
            curl -fsS -H "Authorization: Bearer $LOCAL_SERVICE_ROLE_KEY" "http://127.0.0.1:3002/rest/v1/imds_auth_users?select=id&limit=1" >/dev/null

            systemctl restart imds-marketing.service
            sleep 4
            systemctl is-active --quiet imds-marketing.service
            curl -fsS http://127.0.0.1:8787/api/auth/config | grep -q '"nativeAuth":true'
            echo "PostgREST and native auth runtime recovered."
          '

      - name: Verify native admin login through nginx
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl --fail --silent --show-error --max-time 15 \
            -H 'content-type: application/json' \
            -d '{"email":"admin@imds.kz","password":"Admin12345","remember":true}' \
            "http://$VPS_HOST/api/auth/login")"
          echo "$BODY" | grep -q '"access_token"'
          echo "Native admin login works through nginx."
