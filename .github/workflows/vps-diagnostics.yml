name: VPS Diagnostics

on:
  push:
    branches: [main]
    paths: ['.github/workflows/vps-diagnostics.yml']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - name: Validate VPS access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_PASSWORD"

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Inspect PostgREST
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" '
            set -u
            set -a
            . /etc/imds-postgres.env
            set +a
            echo "=== containers ==="
            docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" | grep -E "NAMES|imds-postgres|imds-postgrest" || true
            echo "=== postgrest logs ==="
            docker logs --tail 160 imds-postgrest 2>&1 || true
            echo "=== port 3001 ==="
            ss -ltnp | grep ':3001' || true
            echo "=== direct 3001 ==="
            curl -sS -D - -o /tmp/pgrst-body -H "Authorization: Bearer $LOCAL_SERVICE_ROLE_KEY" http://127.0.0.1:3001/ || true
            cat /tmp/pgrst-body 2>/dev/null || true
            echo
            echo "=== compatibility 3002 ==="
            curl -sS -D - -o /tmp/compat-body -H "Authorization: Bearer $LOCAL_SERVICE_ROLE_KEY" "http://127.0.0.1:3002/rest/v1/imds_auth_users?select=id&limit=1" || true
            cat /tmp/compat-body 2>/dev/null || true
            echo
            echo "=== postgres role check ==="
            docker exec imds-postgres psql -U imds_owner -d imds_marketing -Atqc "select rolname,rolcanlogin from pg_roles where rolname in ('imds_api','service_role') order by rolname" || true
          '
