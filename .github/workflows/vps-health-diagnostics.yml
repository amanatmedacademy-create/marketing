name: VPS Health Diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vps-health-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - name: Validate VPS access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_PASSWORD"
      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Inspect Super Admin runtime
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" '
            set -u
            echo "=== listening ports ==="
            ss -ltnp | grep -E ":(80|443|8080|8081|3000|3001|4000|5000|5173|8787)[[:space:]]" || true
            echo "=== candidate services ==="
            systemctl list-units --type=service --all --no-pager | grep -Ei "imds|admin|super|node|nginx" || true
            echo "=== candidate processes ==="
            ps -eo pid,cmd --sort=pid | grep -Ei "imdssa|super.?admin|vite|tsx|node" | grep -v grep || true
            echo "=== docker ==="
            docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}" || true
            echo "=== nginx routes ==="
            nginx -T 2>/dev/null | grep -nE "listen|server_name|8080|proxy_pass|imdssa|super" | head -160 || true
            echo "=== local 8080 ==="
            curl -sS -i --max-time 10 http://127.0.0.1:8080/ | head -40 || true
            echo "=== common local probes ==="
            for u in http://127.0.0.1/ http://127.0.0.1:3000/ http://127.0.0.1:5173/ http://127.0.0.1:8081/; do echo "### $u"; curl -sS -i --max-time 5 "$u" | head -20 || true; done
            echo "=== likely directories ==="
            find /opt /srv /var/www -maxdepth 3 -type d \( -iname "*imdssa*" -o -iname "*super*admin*" -o -iname "*imds*admin*" \) 2>/dev/null | head -80 || true
          '
