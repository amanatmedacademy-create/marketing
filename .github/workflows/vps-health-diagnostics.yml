name: VPS Health Diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vps-health-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - name: Validate VPS access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_PASSWORD"
          command -v sshpass >/dev/null
      - name: Inspect Super Admin deploy configuration
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== service ==='
          systemctl show imds-super-admin-api.service \
            -p User -p Group -p WorkingDirectory -p ExecStart -p EnvironmentFiles -p FragmentPath --no-pager || true
          echo '=== nginx ==='
          sed -n '1,220p' /etc/nginx/sites-enabled/imds-super-admin 2>/dev/null || true
          echo '=== directories ==='
          for path in /opt/imds-super-admin /var/www/imds-super-admin; do
            echo "### $path"
            find "$path" -maxdepth 3 -mindepth 1 -printf '%y %p -> %l\n' 2>/dev/null | head -160 || true
          done
          echo '=== env files and keys only ==='
          for file in /etc/imds-super-admin.env /etc/imdssa.env /opt/imds-super-admin/.env /opt/imds-super-admin/api/.env; do
            if [ -f "$file" ]; then
              echo "### $file"
              sed -n 's/^\([A-Za-z_][A-Za-z0-9_]*\)=.*/\1/p' "$file" | sort -u
            fi
          done
          echo '=== database ==='
          sudo -u postgres psql -At -d imdssa <<'SQL'
          select 'db=' || current_database();
          select 'products=' || (to_regclass('public.products') is not null)::int;
          select 'subscriptions=' || (to_regclass('public.subscriptions') is not null)::int;
          select 'licenses=' || (to_regclass('public.licenses') is not null)::int;
          select 'payments=' || (to_regclass('public.payments') is not null)::int;
          select 'entitlements=' || (to_regclass('public.entitlements') is not null)::int;
          select 'payment_method_enum=' || (to_regtype('public.payment_method') is not null)::int;
          select 'set_updated_at=' || (to_regprocedure('public.set_updated_at()') is not null)::int;
          select 'can_manage_billing=' || (to_regprocedure('public.can_manage_billing()') is not null)::int;
          select 'record_payment=' || (to_regprocedure('public.record_payment(uuid,numeric,text,public.payment_method,timestamptz,text,text)') is not null)::int;
          SQL
          echo '=== current frontend ==='
          readlink -f /var/www/imds-super-admin/current || true
          ls -lah /var/www/imds-super-admin/current 2>/dev/null | head -40 || true
          echo '=== api health ==='
          curl -fsS --max-time 10 http://127.0.0.1:8788/healthz || true
          echo
          echo '=== frontend health ==='
          curl -fsSI --max-time 10 http://127.0.0.1:8080/ | head -20 || true
          REMOTE
