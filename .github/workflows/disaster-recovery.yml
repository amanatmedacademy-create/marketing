name: Disaster Recovery VPS

on:
  workflow_dispatch:
    inputs:
      app_origin:
        description: Public application origin for the replacement VPS
        required: true
        type: string
      backup_run_id:
        description: GitHub Actions run ID from Backup VPS Database
        required: true
        type: string
      ssh_port:
        description: SSH port on replacement VPS
        required: true
        default: '22'
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: disaster-recovery-vps
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
      APP_ORIGIN: ${{ inputs.app_origin }}
      SSH_PORT: ${{ inputs.ssh_port }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download encrypted database backup
        uses: actions/download-artifact@v4
        with:
          name: imds-postgres-backup
          path: recovery-backup
          run-id: ${{ inputs.backup_run_id }}
          github-token: ${{ github.token }}

      - name: Verify and decrypt backup
        shell: bash
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          test -n "$BACKUP_ENCRYPTION_KEY" || { echo 'BACKUP_ENCRYPTION_KEY secret is missing'; exit 1; }
          cd recovery-backup
          sha256sum -c imds-marketing.dump.enc.sha256
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in imds-marketing.dump.enc \
            -out imds-marketing.dump \
            -pass env:BACKUP_ENCRYPTION_KEY

      - name: Build application
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > dist/deploy-revision.txt
          tar --exclude=.git --exclude=node_modules --exclude=.env --exclude=.env.local -czf /tmp/imds-marketing-recovery.tgz .

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Upload recovery payload
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS
          SCP_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -P "$SSH_PORT")
          sshpass -e scp "${SCP_ARGS[@]}" /tmp/imds-marketing-recovery.tgz "$VPS_USER@$VPS_HOST:/tmp/imds-marketing-recovery.tgz"
          sshpass -e scp "${SCP_ARGS[@]}" recovery-backup/imds-marketing.dump "$VPS_USER@$VPS_HOST:/tmp/imds-marketing.dump"

      - name: Rebuild VPS and restore database
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=20 -o ServerAliveCountMax=90 -p "$SSH_PORT")
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" "APP_ORIGIN='$APP_ORIGIN' GITHUB_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          rm -rf /opt/imds-marketing/repository
          mkdir -p /opt/imds-marketing/repository
          tar -xzf /tmp/imds-marketing-recovery.tgz -C /opt/imds-marketing/repository

          chmod +x /opt/imds-marketing/repository/infra/bootstrap-server.sh
          chmod +x /opt/imds-marketing/repository/infra/health-check.sh
          chmod +x /opt/imds-marketing/repository/infra/backup/restore.sh
          chmod +x /opt/imds-marketing/repository/deploy/vps/install-release.sh

          APP_ORIGIN="$APP_ORIGIN" /opt/imds-marketing/repository/infra/bootstrap-server.sh /opt/imds-marketing/repository
          /opt/imds-marketing/repository/infra/backup/restore.sh /tmp/imds-marketing.dump
          /opt/imds-marketing/repository/deploy/vps/install-release.sh /tmp/imds-marketing-recovery.tgz "${GITHUB_SHA:0:12}"
          /opt/imds-marketing/repository/infra/health-check.sh
          REMOTE

      - name: Verify recovered application
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 "$APP_ORIGIN/api/health"
          curl --fail --silent --show-error --max-time 20 "$APP_ORIGIN/integrations" | grep -qi '<html'
