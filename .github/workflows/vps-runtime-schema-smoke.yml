name: Verify Repaired Marketing Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vps-runtime-schema-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Verify operations and Ad Manager APIs
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          COMPANY_ID='4cd22020-6f1d-4afb-9266-b01c96e4a927'
          API='http://127.0.0.1:8787'

          AUTH_USER_ID="$(docker exec imds-postgres psql -U imds_owner -d imds_marketing -At -c "select id from public.imds_auth_users where lower(email)='admin@imds.kz' and status='active' limit 1")"
          test -n "$AUTH_USER_ID"
          TOKEN="$(openssl rand -hex 48)"
          TOKEN_HASH="$(printf '%s' "$TOKEN" | sha256sum | awk '{print $1}')"
          docker exec imds-postgres psql -U imds_owner -d imds_marketing -v ON_ERROR_STOP=1 -c "insert into public.imds_auth_sessions(user_id,token_hash,remember_me,expires_at) values ('$AUTH_USER_ID'::uuid,'$TOKEN_HASH',false,now()+interval '10 minutes')" >/dev/null
          cleanup() {
            docker exec imds-postgres psql -U imds_owner -d imds_marketing -c "delete from public.imds_auth_sessions where token_hash='$TOKEN_HASH'" >/dev/null 2>&1 || true
            rm -f /tmp/tasks-api.json /tmp/ad-manager-api.json
          }
          trap cleanup EXIT

          common=(-H "Authorization: Bearer $TOKEN" -H "x-imds-company-id: $COMPANY_ID")

          curl -fsS --max-time 15 "${common[@]}" "$API/api/operations/tasks?limit=1" -o /tmp/tasks-api.json
          python3 - <<'PY'
          import json
          with open('/tmp/tasks-api.json', encoding='utf-8') as stream:
              value = json.load(stream)
          if not isinstance(value, list):
              raise SystemExit(f'Unexpected tasks response: {type(value).__name__}')
          print('OPERATIONS_TASKS_API=ok')
          PY

          curl -fsS --max-time 20 "${common[@]}" "$API/api/analytics/ad-manager?days=30" -o /tmp/ad-manager-api.json
          python3 - <<'PY'
          import json
          with open('/tmp/ad-manager-api.json', encoding='utf-8') as stream:
              value = json.load(stream)
          if not isinstance(value, dict) or not isinstance(value.get('rows'), list) or not isinstance(value.get('accounts'), list):
              raise SystemExit('Unexpected Ad Manager response')
          print(f"AD_MANAGER_API=ok rows={len(value['rows'])} accounts={len(value['accounts'])}")
          PY
          REMOTE
