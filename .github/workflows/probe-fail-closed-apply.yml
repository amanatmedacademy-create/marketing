name: Probe Fail Closed Rollout

on:
  issues:
    types: [edited]

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  probe:
    if: github.event.issue.number == 227
    runs-on: ubuntu-latest
    steps:
      - name: Report rollout runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: '5c010000eff8131b395982c43d967e5303621929'
        run: |
          set -euo pipefail
          ci="$(gh run list --repo "$REPO" --workflow ci.yml --limit 8 --json databaseId,status,conclusion,headSha,event,createdAt --jq --arg sha "$TARGET_SHA" '[.[]|select(.headSha==$sha)][0]')"
          deploy="$(gh run list --repo "$REPO" --workflow deploy-vps.yml --limit 8 --json databaseId,status,conclusion,headSha,event,createdAt --jq --arg sha "$TARGET_SHA" '[.[]|select(.headSha==$sha)][0]')"
          gh issue comment 227 --repo "$REPO" --body "rollout_probe ci=$ci deploy=$deploy"
