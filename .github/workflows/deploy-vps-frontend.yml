name: Deploy VPS Frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'deploy/vps/nginx-imds-marketing.conf'
      - '.github/workflows/deploy-vps-frontend.yml'

permissions:
  contents: read

concurrency:
  group: deploy-vps-frontend
  cancel-in-progress: true

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}

    steps:
      - name: Validate VPS secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo 'VPS_HOST secret is missing'; exit 1; }
          test -n "$VPS_USER" || { echo 'VPS_USER secret is missing'; exit 1; }
          test -n "$VPS_PASSWORD" || { echo 'VPS_PASSWORD secret is missing'; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Verify integrations build
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          grep -R -F -q 'Binotel' dist || { echo 'Binotel is missing from production build'; exit 1; }
          grep -R -F -q 'Sipuni' dist || { echo 'Sipuni is missing from production build'; exit 1; }
          if grep -R -F -q 'Остальные коммуникационные сервисы подключим после проверки основных источников.' dist; then
            echo 'Legacy integrations section is still present in production build'
            exit 1
          fi

      - name: Stamp frontend revision
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > dist/deploy-revision.txt

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Upload and activate frontend release
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=20 -o ServerAliveCountMax=30)

          tar -czf /tmp/imds-frontend.tgz -C dist .
          sshpass -e scp "${SSH_ARGS[@]}" /tmp/imds-frontend.tgz "$VPS_USER@$VPS_HOST:/tmp/imds-frontend.tgz"
          sshpass -e scp "${SSH_ARGS[@]}" deploy/vps/nginx-imds-marketing.conf "$VPS_USER@$VPS_HOST:/tmp/nginx-imds-marketing.conf"

          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" "GITHUB_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -euo pipefail

          RELEASE_DIR="/var/www/imds-marketing/releases/${GITHUB_SHA:0:12}-$(date -u +%Y%m%d%H%M%S)"
          mkdir -p "$RELEASE_DIR" /var/www/imds-marketing/releases
          tar -xzf /tmp/imds-frontend.tgz -C "$RELEASE_DIR"

          test "$(cat "$RELEASE_DIR/deploy-revision.txt")" = "$GITHUB_SHA"

          ln -sfn "$RELEASE_DIR" /var/www/imds-marketing/current
          install -m 0644 /tmp/nginx-imds-marketing.conf /etc/nginx/sites-available/imds-marketing
          ln -sfn /etc/nginx/sites-available/imds-marketing /etc/nginx/sites-enabled/imds-marketing
          rm -f /etc/nginx/sites-enabled/default

          nginx -T 2>/dev/null | grep -F 'root /var/www/imds-marketing/current;' >/dev/null
          nginx -t
          systemctl reload nginx

          test "$(readlink -f /var/www/imds-marketing/current)" = "$RELEASE_DIR"
          test "$(cat /var/www/imds-marketing/current/deploy-revision.txt)" = "$GITHUB_SHA"

          curl --fail --silent --show-error --max-time 10 http://127.0.0.1/integrations > /tmp/imds-integrations-live.html
          grep -qi '<html' /tmp/imds-integrations-live.html

          ASSET=$(grep -oE '/assets/[^"[:space:]]+\.js' /tmp/imds-integrations-live.html | head -n 1)
          test -n "$ASSET" || { echo 'No JS bundle referenced by live /integrations'; exit 1; }
          BUNDLE="/var/www/imds-marketing/current${ASSET}"
          test -f "$BUNDLE" || { echo "Live JS bundle not found: $BUNDLE"; exit 1; }

          grep -F -q 'Binotel' "$BUNDLE" || { echo 'Live JS bundle does not contain Binotel'; exit 1; }
          grep -F -q 'Sipuni' "$BUNDLE" || { echo 'Live JS bundle does not contain Sipuni'; exit 1; }
          if grep -F -q 'Остальные коммуникационные сервисы подключим после проверки основных источников.' "$BUNDLE"; then
            echo 'Live JS bundle still contains the legacy integrations section'
            exit 1
          fi

          find /var/www/imds-marketing/releases -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
            | sort -nr \
            | tail -n +6 \
            | cut -d' ' -f2- \
            | xargs -r rm -rf

          rm -f /tmp/imds-frontend.tgz /tmp/nginx-imds-marketing.conf /tmp/imds-integrations-live.html
          echo "Activated frontend release: $RELEASE_DIR"
          REMOTE

      - name: Verify public integrations revision
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            revision=$(curl --fail --silent --show-error --max-time 10 -H 'Cache-Control: no-cache' "http://$VPS_HOST/deploy-revision.txt?sha=$GITHUB_SHA" || true)
            if [ "$revision" = "$GITHUB_SHA" ]; then
              body=$(curl --fail --silent --show-error --max-time 10 -H 'Cache-Control: no-cache' "http://$VPS_HOST/integrations?sha=$GITHUB_SHA")
              printf '%s' "$body" | grep -qi '<html'
              echo "Frontend revision $GITHUB_SHA is live at http://$VPS_HOST/integrations"
              exit 0
            fi
            echo "Live revision is '${revision:-unreachable}', expected '$GITHUB_SHA' (attempt $attempt)"
            sleep 5
          done
          echo 'Public VPS frontend revision verification failed'
          exit 1
