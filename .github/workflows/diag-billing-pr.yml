name: Diagnose Billing PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  billing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run billing regression
        id: billing
        shell: bash
        run: |
          set +e
          node --test tests/billingCenter.test.mjs > billing-test.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: billing-test-log
          path: billing-test.log
      - name: Fail if billing regression failed
        shell: bash
        run: test "${{ steps.billing.outputs.exit_code }}" = "0"
