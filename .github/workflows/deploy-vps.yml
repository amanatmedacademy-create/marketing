name: Deploy VPS

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-vps-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      INTEGRATION_ENCRYPTION_KEY: ${{ secrets.INTEGRATION_ENCRYPTION_KEY }}
      SUPABASE_URL: https://kysdtmgijkffwtzugonv.supabase.co
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt5c2R0bWdpamtmZnd0enVnb252Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNjkwNDcsImV4cCI6MjEwMDc0NTA0N30.TWhLZ79Hu8QUb4OjZxkRH5DqPlSpBDWBpGf6LZRm8DY
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_moNNYVxarzZA_Qj3rMoWxA_--X_8GjG
      DEFAULT_COMPANY_ID: 4cd22020-6f1d-4afb-9266-b01c96e4a927
      VITE_SUPABASE_URL: https://kysdtmgijkffwtzugonv.supabase.co
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt5c2R0bWdpamtmZnd0enVnb252Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNjkwNDcsImV4cCI6MjEwMDc0NTA0N30.TWhLZ79Hu8QUb4OjZxkRH5DqPlSpBDWBpGf6LZRm8DY
      META_GRAPH_VERSION: v23.0
      BITRIX_ENTITY_TYPE_ID: '1'
      BITRIX_SYNC_DAYS: '7'
    steps:
      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo 'VPS_HOST secret is missing'; exit 1; }
          test -n "$VPS_USER" || { echo 'VPS_USER secret is missing'; exit 1; }
          test -n "$VPS_PASSWORD" || { echo 'VPS_PASSWORD secret is missing'; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo 'SUPABASE_SERVICE_ROLE_KEY secret is missing'; exit 1; }
          test -n "$OPENAI_API_KEY" || { echo 'OPENAI_API_KEY secret is missing'; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.env \
            --exclude=.env.local \
            -czf /tmp/imds-marketing-release.tgz .

      - name: Prepare server environment
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > /tmp/imds-marketing.env <<ENVFILE
          APP_ORIGIN=http://$VPS_HOST
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
          OPENAI_API_KEY=$OPENAI_API_KEY
          INTEGRATION_ENCRYPTION_KEY=$INTEGRATION_ENCRYPTION_KEY
          DEFAULT_COMPANY_ID=$DEFAULT_COMPANY_ID
          META_GRAPH_VERSION=$META_GRAPH_VERSION
          BITRIX_ENTITY_TYPE_ID=$BITRIX_ENTITY_TYPE_ID
          BITRIX_SYNC_DAYS=$BITRIX_SYNC_DAYS
          ENVFILE

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Bootstrap and upload release
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          export SSHPASS
          sshpass -e scp "${SSH_ARGS[@]}" deploy/vps/bootstrap-host.sh "$VPS_USER@$VPS_HOST:/tmp/imds-bootstrap.sh"
          sshpass -e scp "${SSH_ARGS[@]}" deploy/vps/install-release.sh "$VPS_USER@$VPS_HOST:/tmp/imds-install-release.sh"
          sshpass -e scp "${SSH_ARGS[@]}" /tmp/imds-marketing-release.tgz "$VPS_USER@$VPS_HOST:/tmp/imds-marketing-release.tgz"
          sshpass -e scp "${SSH_ARGS[@]}" /tmp/imds-marketing.env "$VPS_USER@$VPS_HOST:/tmp/imds-marketing.env"
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" 'chmod 700 /tmp/imds-bootstrap.sh /tmp/imds-install-release.sh && /tmp/imds-bootstrap.sh && install -o root -g root -m 600 /tmp/imds-marketing.env /etc/imds-marketing.env && rm -f /tmp/imds-marketing.env'

      - name: Install release
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          export SSHPASS
          RELEASE_ID="${GITHUB_SHA:0:12}"
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" "/tmp/imds-install-release.sh /tmp/imds-marketing-release.tgz '$RELEASE_ID'"

      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 "http://$VPS_HOST/api/health"; then
              echo
              exit 0
            fi
            sleep 5
          done
          echo 'VPS health check failed'
          exit 1
