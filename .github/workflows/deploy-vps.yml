name: Deploy VPS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'server/**'
      - 'services/**'
      - 'supabase/**'
      - 'scripts/**'
      - 'deploy/vps/bootstrap-host.sh'
      - 'deploy/vps/install-release.sh'
      - 'deploy/vps/imds-marketing.service'
      - 'deploy/vps/imds-marketing-scheduler.service'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.worker.json'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-vps.yml'

permissions:
  contents: read

concurrency:
  group: deploy-vps-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || '89.207.250.55' }}
      VPS_USER: ${{ secrets.VPS_USER || 'imdsops' }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
      CLOUDPAYMENTS_PUBLIC_ID: ${{ secrets.CLOUDPAYMENTS_PUBLIC_ID }}
      CLOUDPAYMENTS_API_SECRET: ${{ secrets.CLOUDPAYMENTS_API_SECRET }}
      IMDS_OAUTH_ENV: ${{ secrets.IMDS_OAUTH_ENV }}
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Configure deployment access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo 'VPS_HOST is missing'; exit 1; }
          test -n "$VPS_USER" || { echo 'VPS_USER is missing'; exit 1; }
          test -n "$DEPLOY_SHA" || { echo 'DEPLOY_SHA is missing'; exit 1; }
          if [ -z "$VPS_SSH_KEY" ] && [ -z "$VPS_PASSWORD" ]; then
            echo 'Configure VPS_SSH_KEY or VPS_PASSWORD in GitHub Actions secrets.'
            exit 1
          fi

          if [ -n "$VPS_SSH_KEY" ]; then
            KEY_FILE="$RUNNER_TEMP/imds-vps-key"
            umask 077
            printf '%s\n' "$VPS_SSH_KEY" > "$KEY_FILE"
            chmod 600 "$KEY_FILE"
            cat > "$RUNNER_TEMP/imds-ssh" <<EOF
          #!/usr/bin/env bash
          exec ssh -i "$KEY_FILE" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "\$@"
          EOF
            cat > "$RUNNER_TEMP/imds-scp" <<EOF
          #!/usr/bin/env bash
          exec scp -i "$KEY_FILE" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "\$@"
          EOF
          else
            command -v sshpass >/dev/null || { echo 'sshpass is unavailable on the runner'; exit 1; }
            cat > "$RUNNER_TEMP/imds-ssh" <<'EOF'
          #!/usr/bin/env bash
          export SSHPASS="${VPS_PASSWORD:-}"
          exec sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$@"
          EOF
            cat > "$RUNNER_TEMP/imds-scp" <<'EOF'
          #!/usr/bin/env bash
          export SSHPASS="${VPS_PASSWORD:-}"
          exec sshpass -e scp -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$@"
          EOF
          fi
          chmod 700 "$RUNNER_TEMP/imds-ssh" "$RUNNER_TEMP/imds-scp"

      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.env \
            --exclude=.env.local \
            -czf /tmp/imds-marketing-release.tgz .

      - name: Bootstrap and upload release
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/imds-scp" deploy/vps/bootstrap-host.sh "$VPS_USER@$VPS_HOST:/tmp/imds-bootstrap.sh"
          "$RUNNER_TEMP/imds-scp" deploy/vps/install-release.sh "$VPS_USER@$VPS_HOST:/tmp/imds-install-release.sh"
          "$RUNNER_TEMP/imds-scp" /tmp/imds-marketing-release.tgz "$VPS_USER@$VPS_HOST:/tmp/imds-marketing-release.tgz"
          "$RUNNER_TEMP/imds-ssh" "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            chmod 700 /tmp/imds-bootstrap.sh /tmp/imds-install-release.sh
            sudo /tmp/imds-bootstrap.sh
            sudo test -f /etc/imds-marketing.env || { echo "/etc/imds-marketing.env is missing"; exit 1; }
            sudo grep -q "^IMDS_LOCAL_DB_URL=" /etc/imds-marketing.env || { echo "IMDS_LOCAL_DB_URL is missing"; exit 1; }
            sudo grep -q "^IMDS_LOCAL_SERVICE_ROLE_KEY=" /etc/imds-marketing.env || { echo "IMDS_LOCAL_SERVICE_ROLE_KEY is missing"; exit 1; }
            if ! sudo grep -q "^INTEGRATION_ENCRYPTION_KEY=" /etc/imds-marketing.env; then
              key="$(openssl rand -hex 48)"
              printf "INTEGRATION_ENCRYPTION_KEY=%s\n" "$key" | sudo tee -a /etc/imds-marketing.env >/dev/null
            fi
            sudo chmod 600 /etc/imds-marketing.env
          '

      - name: Configure unified OAuth secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$IMDS_OAUTH_ENV" ]; then
            echo 'IMDS_OAUTH_ENV is not configured; keeping existing VPS OAuth configuration.'
            exit 0
          fi
          umask 077
          printf '%s\n' "$IMDS_OAUTH_ENV" > /tmp/imds-oauth.env
          if grep -nEv '^[[:space:]]*$|^[[:space:]]*#|^(APP_ORIGIN|GOOGLE_CLIENT_ID|GOOGLE_CLIENT_SECRET|GOOGLE_ADS_DEVELOPER_TOKEN|META_APP_ID|META_APP_SECRET|META_WABA_CONFIG_ID|META_GRAPH_VERSION|META_OAUTH_REDIRECT_URI|BINOTEL_OAUTH_CLIENT_ID|BINOTEL_OAUTH_CLIENT_SECRET|BINOTEL_OAUTH_AUTHORIZE_URL|BINOTEL_OAUTH_TOKEN_URL|BINOTEL_OAUTH_SCOPES|BINOTEL_OAUTH_REDIRECT_URI|BINOTEL_OAUTH_TOKEN_AUTH_METHOD|BINOTEL_OAUTH_AUTHORIZE_PARAMS|BINOTEL_OAUTH_TOKEN_PARAMS)=[^[:cntrl:]]*$' /tmp/imds-oauth.env; then
            echo 'IMDS_OAUTH_ENV contains unsupported keys or invalid lines.'
            rm -f /tmp/imds-oauth.env
            exit 1
          fi
          "$RUNNER_TEMP/imds-scp" /tmp/imds-oauth.env "$VPS_USER@$VPS_HOST:/tmp/imds-oauth.env"
          "$RUNNER_TEMP/imds-ssh" "$VPS_USER@$VPS_HOST" 'sudo install -o root -g imds-platform -m 0640 /tmp/imds-oauth.env /etc/imds-oauth.env && rm -f /tmp/imds-oauth.env'
          rm -f /tmp/imds-oauth.env
          echo 'Unified OAuth environment installed on VPS.'

      - name: Configure CloudPayments secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CLOUDPAYMENTS_PUBLIC_ID" ] || [ -z "$CLOUDPAYMENTS_API_SECRET" ]; then
            echo 'CloudPayments GitHub secrets are not configured; checkout remains disabled.'
            exit 0
          fi
          umask 077
          printf 'CLOUDPAYMENTS_PUBLIC_ID=%s\nCLOUDPAYMENTS_API_SECRET=%s\n' "$CLOUDPAYMENTS_PUBLIC_ID" "$CLOUDPAYMENTS_API_SECRET" > /tmp/imds-cloudpayments.env
          "$RUNNER_TEMP/imds-scp" /tmp/imds-cloudpayments.env "$VPS_USER@$VPS_HOST:/tmp/imds-cloudpayments.env"
          "$RUNNER_TEMP/imds-ssh" "$VPS_USER@$VPS_HOST" 'sudo install -o root -g imds-platform -m 0640 /tmp/imds-cloudpayments.env /etc/imds-cloudpayments.env && rm -f /tmp/imds-cloudpayments.env'
          rm -f /tmp/imds-cloudpayments.env

      - name: Install release
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_ID="${DEPLOY_SHA:0:12}"
          "$RUNNER_TEMP/imds-ssh" "$VPS_USER@$VPS_HOST" "sudo /tmp/imds-install-release.sh /tmp/imds-marketing-release.tgz '$RELEASE_ID'"

      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            if curl --fail --silent --show-error --max-time 10 "http://$VPS_HOST/api/health"; then
              echo
              exit 0
            fi
            sleep 5
          done
          echo 'VPS health check failed'
          exit 1
