name: Deploy VPS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'services/**'
      - 'supabase/**'
      - 'scripts/**'
      - 'deploy/vps/bootstrap-host.sh'
      - 'deploy/vps/install-release.sh'
      - 'deploy/vps/imds-marketing.service'
      - 'deploy/vps/imds-marketing-scheduler.service'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.worker.json'
      - 'wrangler.jsonc'

permissions:
  contents: read

concurrency:
  group: deploy-vps-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
      VPS_PORT: '24'
      CLOUDPAYMENTS_PUBLIC_ID: ${{ secrets.CLOUDPAYMENTS_PUBLIC_ID }}
      CLOUDPAYMENTS_API_SECRET: ${{ secrets.CLOUDPAYMENTS_API_SECRET }}
      IMDS_OAUTH_ENV: ${{ secrets.IMDS_OAUTH_ENV }}
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Validate deployment access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo 'VPS_HOST secret is missing'; exit 1; }
          test -n "$VPS_USER" || { echo 'VPS_USER secret is missing'; exit 1; }
          test -n "$VPS_PASSWORD" || { echo 'VPS_PASSWORD secret is missing'; exit 1; }
          test -n "$VPS_PORT" || { echo 'VPS_PORT is missing'; exit 1; }
          test -n "$DEPLOY_SHA" || { echo 'DEPLOY_SHA is missing'; exit 1; }
          command -v sshpass >/dev/null || { echo 'sshpass is unavailable on the runner'; exit 1; }

      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.env \
            --exclude=.env.local \
            -czf /tmp/imds-marketing-release.tgz .

      - name: Bootstrap and upload release
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o "Port=$VPS_PORT")
          export SSHPASS
          sshpass -e scp "${SSH_ARGS[@]}" deploy/vps/bootstrap-host.sh "$VPS_USER@$VPS_HOST:/tmp/imds-bootstrap.sh"
          sshpass -e scp "${SSH_ARGS[@]}" deploy/vps/install-release.sh "$VPS_USER@$VPS_HOST:/tmp/imds-install-release.sh"
          sshpass -e scp "${SSH_ARGS[@]}" /tmp/imds-marketing-release.tgz "$VPS_USER@$VPS_HOST:/tmp/imds-marketing-release.tgz"
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            chmod 700 /tmp/imds-bootstrap.sh /tmp/imds-install-release.sh
            /tmp/imds-bootstrap.sh
            test -f /etc/imds-marketing.env || { echo "/etc/imds-marketing.env is missing"; exit 1; }
            grep -q "^IMDS_LOCAL_DB_URL=" /etc/imds-marketing.env || { echo "IMDS_LOCAL_DB_URL is missing"; exit 1; }
            grep -q "^IMDS_LOCAL_SERVICE_ROLE_KEY=" /etc/imds-marketing.env || { echo "IMDS_LOCAL_SERVICE_ROLE_KEY is missing"; exit 1; }
            if ! grep -q "^INTEGRATION_ENCRYPTION_KEY=" /etc/imds-marketing.env; then
              umask 077
              printf "INTEGRATION_ENCRYPTION_KEY=%s\n" "$(openssl rand -hex 48)" >> /etc/imds-marketing.env
            fi
            chmod 600 /etc/imds-marketing.env
          '

      - name: Configure unified OAuth secrets
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$IMDS_OAUTH_ENV" ]; then
            echo 'IMDS_OAUTH_ENV is not configured; keeping existing VPS OAuth configuration.'
            exit 0
          fi
          umask 077
          printf '%s\n' "$IMDS_OAUTH_ENV" > /tmp/imds-oauth.env
          if grep -nEv '^[[:space:]]*$|^[[:space:]]*#|^(APP_ORIGIN|GOOGLE_CLIENT_ID|GOOGLE_CLIENT_SECRET|GOOGLE_ADS_DEVELOPER_TOKEN|META_APP_ID|META_APP_SECRET|META_WABA_CONFIG_ID|META_GRAPH_VERSION|META_OAUTH_REDIRECT_URI)=[^[:cntrl:]]*$' /tmp/imds-oauth.env; then
            echo 'IMDS_OAUTH_ENV contains unsupported keys or invalid lines.'
            rm -f /tmp/imds-oauth.env
            exit 1
          fi
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o "Port=$VPS_PORT")
          export SSHPASS
          sshpass -e scp "${SSH_ARGS[@]}" /tmp/imds-oauth.env "$VPS_USER@$VPS_HOST:/tmp/imds-oauth.env"
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" 'sudo install -o root -g imds-platform -m 0640 /tmp/imds-oauth.env /etc/imds-oauth.env && rm -f /tmp/imds-oauth.env'
          rm -f /tmp/imds-oauth.env
          echo 'Unified OAuth environment installed on VPS.'

      - name: Configure CloudPayments secrets
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDPAYMENTS_PUBLIC_ID" ] || [ -z "$CLOUDPAYMENTS_API_SECRET" ]; then
            echo 'CloudPayments GitHub secrets are not configured; checkout remains disabled.'
            exit 0
          fi
          umask 077
          printf 'CLOUDPAYMENTS_PUBLIC_ID=%s\nCLOUDPAYMENTS_API_SECRET=%s\n' "$CLOUDPAYMENTS_PUBLIC_ID" "$CLOUDPAYMENTS_API_SECRET" > /tmp/imds-cloudpayments.env
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o "Port=$VPS_PORT")
          export SSHPASS
          sshpass -e scp "${SSH_ARGS[@]}" /tmp/imds-cloudpayments.env "$VPS_USER@$VPS_HOST:/tmp/imds-cloudpayments.env"
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" 'sudo install -o root -g imds-platform -m 0640 /tmp/imds-cloudpayments.env /etc/imds-cloudpayments.env && rm -f /tmp/imds-cloudpayments.env'
          rm -f /tmp/imds-cloudpayments.env

      - name: Install release
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o "Port=$VPS_PORT")
          export SSHPASS
          RELEASE_ID="${DEPLOY_SHA:0:12}"
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" "/tmp/imds-install-release.sh /tmp/imds-marketing-release.tgz '$RELEASE_ID'"

      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            if curl --fail --silent --show-error --max-time 10 "http://$VPS_HOST/api/health"; then
              echo
              exit 0
            fi
            sleep 5
          done
          echo 'VPS health check failed'
          exit 1
