name: Verify VPS Native Auth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-vps-access-control.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - name: Validate VPS access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_PASSWORD"

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Prepare verification script
        shell: bash
        run: |
          cat > /tmp/verify-native-auth.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          if ! curl -fsS --max-time 10 http://127.0.0.1:8787/api/auth/config >/tmp/auth-config.json; then
            systemctl restart imds-marketing.service
            for attempt in $(seq 1 15); do
              if curl -fsS --max-time 10 http://127.0.0.1:8787/api/auth/config >/tmp/auth-config.json; then
                break
              fi
              sleep 2
            done
          fi
          cat /tmp/auth-config.json
          echo

          AUTH_ID="$(docker exec imds-postgres psql -U imds_owner -d imds_marketing -Atqc "select id from public.imds_auth_users where lower(email)=lower('admin@imds.kz') limit 1")"
          test -n "$AUTH_ID"
          TOKEN="$(openssl rand -hex 48)"
          TOKEN_HASH="$(printf '%s' "$TOKEN" | sha256sum | awk '{print $1}')"

          cleanup() {
            docker exec imds-postgres psql -U imds_owner -d imds_marketing -c "delete from public.imds_auth_sessions where token_hash='${TOKEN_HASH}';" >/dev/null 2>&1 || true
            rm -f /tmp/auth-me.json /tmp/auth-config.json
          }
          trap cleanup EXIT

          docker exec imds-postgres psql -v ON_ERROR_STOP=1 -U imds_owner -d imds_marketing \
            -c "insert into public.imds_auth_sessions(user_id,token_hash,remember_me,expires_at) values ('${AUTH_ID}'::uuid,'${TOKEN_HASH}',false,now()+interval '10 minutes');"

          STATUS="$(curl -sS --max-time 20 -o /tmp/auth-me.json -w '%{http_code}' -H "authorization: Bearer $TOKEN" http://127.0.0.1:8787/api/auth/me)"
          echo "AUTH_ME_STATUS=$STATUS"
          cat /tmp/auth-me.json
          echo

          if [ "$STATUS" != "200" ]; then
            echo "=== recent runtime journal ==="
            journalctl -u imds-marketing.service -n 120 --no-pager -o cat || true
            exit 1
          fi
          SCRIPT
          chmod 700 /tmp/verify-native-auth.sh

      - name: Verify native admin session on VPS
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          sshpass -e scp "${SSH_ARGS[@]}" /tmp/verify-native-auth.sh "$VPS_USER@$VPS_HOST:/tmp/verify-native-auth.sh"
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" 'chmod 700 /tmp/verify-native-auth.sh && /tmp/verify-native-auth.sh; rc=$?; rm -f /tmp/verify-native-auth.sh; exit $rc'
