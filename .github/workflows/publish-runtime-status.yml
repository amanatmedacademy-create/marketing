name: Publish Runtime Status

on:
  workflow_run:
    workflows:
      - CI
      - Apply Account Clinic Foundation VPS
      - Deploy VPS
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Publish commit status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TARGET_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          case "$WORKFLOW_NAME" in
            "CI") context="imds/ci" ;;
            "Apply Account Clinic Foundation VPS") context="imds/account-clinic-schema" ;;
            "Deploy VPS") context="imds/vps-deploy" ;;
            *) echo "Unsupported workflow: $WORKFLOW_NAME"; exit 1 ;;
          esac
          if [ "$WORKFLOW_CONCLUSION" = "success" ]; then
            state="success"
            description="$WORKFLOW_NAME succeeded"
          else
            state="failure"
            description="$WORKFLOW_NAME: ${WORKFLOW_CONCLUSION:-unknown}"
          fi
          payload=$(jq -nc \
            --arg state "$state" \
            --arg context "$context" \
            --arg description "$description" \
            --arg target_url "$TARGET_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl -fsSL \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -d "$payload"
