name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish CI pending status
        if: ${{ github.event_name == 'push' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload=$(jq -nc \
            --arg state pending \
            --arg context imds/ci \
            --arg description 'CI validation is running' \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl -fsSL \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload" >/dev/null
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Schedule CRM regression tests
        run: npm run test:schedule-crm
      - name: Integration regression tests
        run: npm run test:integrations
      - name: Account and platform regression tests
        run: npm run test:account-platform
      - name: Team administration regression tests
        run: npm run test:team-admin
      - name: Operating overview regression tests
        run: npm run test:operating-overview
      - name: Quota enforcement regression tests
        run: npm run test:quotas
      - name: Billing Center regression tests
        run: npm run test:billing
      - name: Account security regression tests
        run: npm run test:account-security
      - name: Branch hierarchy regression tests
        run: npm run test:branches
      - name: Integration branch routing regression tests
        run: npm run test:integration-routing
      - name: Fail-closed entitlement regression tests
        run: npm run test:fail-closed
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Publish CI success status
        if: ${{ success() && github.event_name == 'push' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload=$(jq -nc \
            --arg state success \
            --arg context imds/ci \
            --arg description 'CI validation succeeded' \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl -fsSL \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload" >/dev/null
      - name: Publish CI failure status
        if: ${{ failure() && github.event_name == 'push' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          payload=$(jq -nc \
            --arg state failure \
            --arg context imds/ci \
            --arg description 'CI validation failed' \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl -fsSL \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload" >/dev/null
