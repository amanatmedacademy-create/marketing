name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Schedule CRM regression tests
        run: npm run test:schedule-crm

      - name: Integration regression tests
        run: npm run test:integrations

      - name: Account and platform regression tests
        run: npm run test:account-platform

      - name: Team administration regression tests
        run: npm run test:team-admin

      - name: Operating overview regression tests
        run: npm run test:operating-overview

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
