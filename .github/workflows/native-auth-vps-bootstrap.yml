name: Native Auth VPS Bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-auth-vps-bootstrap.yml'
      - 'worker/nativeAuth.ts'
      - 'worker/auth.ts'
      - 'worker/companyContext.ts'
      - 'deploy/vps/nginx-imds-marketing.conf'
      - 'supabase/migrations/20260817170000_native_auth_and_tenant_registration.sql'
      - 'supabase/migrations/20260817170500_native_auth_google_oauth.sql'
      - 'supabase/migrations/20260817171000_native_auth_registration_rpc.sql'
      - 'supabase/migrations/20260817171500_native_auth_onboarding_rpc.sql'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-auth-vps-bootstrap
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - name: Validate VPS access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_PASSWORD"

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Package backend release
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=node_modules --exclude=.env --exclude=.env.local -czf /tmp/imds-native-auth-release.tgz .

      - name: Prepare one-time admin bootstrap SQL
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > /tmp/imds-bootstrap-admin.sql <<'SQL'
          do $$
          declare
            v_auth_user_id uuid;
            v_marketing_user_id uuid;
          begin
            select id into v_auth_user_id
            from public.imds_auth_users
            where lower(btrim(email)) = 'admin@imds.kz'
            limit 1;

            if v_auth_user_id is null then
              v_auth_user_id := '1001dad1-e7a1-48b4-ae30-4d1bf353ff98';
              insert into public.imds_auth_users(id,email,display_name,status,email_verified)
              values (v_auth_user_id,'admin@imds.kz','IMDS Administrator','active',true);
            else
              update public.imds_auth_users
              set display_name='IMDS Administrator', status='active', email_verified=true, updated_at=now()
              where id=v_auth_user_id;
            end if;

            insert into public.imds_auth_passwords(user_id,password_hash,created_at,updated_at)
            values (
              v_auth_user_id,
              'pbkdf2_sha256$600000$DabXpGiJd9g4PVNRx7WP0V5Rz1pGNppW$9pFf5OdI9Bg9LMmg9tp6YBMOkI9uO1LG_4J0BRFzZnM',
              now(),now()
            )
            on conflict (user_id) do update
              set password_hash=excluded.password_hash, updated_at=now();

            select id into v_marketing_user_id
            from public.marketing_users
            where lower(btrim(email)) = 'admin@imds.kz'
            limit 1;

            if v_marketing_user_id is null then
              v_marketing_user_id := 'eb285147-b651-49c8-b240-9ba6036df862';
              insert into public.marketing_users(
                id,auth_user_id,name,email,role,status,provider,provider_metadata,full_name
              ) values (
                v_marketing_user_id,v_auth_user_id,'IMDS Administrator','admin@imds.kz',
                'administrator','active','password','{}'::jsonb,'IMDS Administrator'
              );
            else
              update public.marketing_users
              set auth_user_id=v_auth_user_id,
                  name='IMDS Administrator',
                  full_name='IMDS Administrator',
                  role='administrator',
                  status='active',
                  provider='password',
                  updated_at=now()
              where id=v_marketing_user_id;
            end if;

            insert into public.crm_companies(id,name,slug,timezone,currency,created_by)
            values (
              '4cd22020-6f1d-4afb-9266-b01c96e4a927',
              'Amanat Med Academy',
              'amanat-med-academy',
              'Asia/Almaty',
              'KZT',
              v_marketing_user_id
            )
            on conflict (id) do update
              set name=excluded.name,
                  slug=excluded.slug,
                  timezone=excluded.timezone,
                  currency=excluded.currency,
                  created_by=excluded.created_by,
                  updated_at=now();

            insert into public.crm_company_members(company_id,user_id,role,status)
            values ('4cd22020-6f1d-4afb-9266-b01c96e4a927',v_marketing_user_id,'owner','active')
            on conflict (company_id,user_id) do update
              set role='owner', status='active';
          end
          $$;
          SQL

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Upload release and bootstrap SQL
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=20 -o ServerAliveCountMax=20)
          sshpass -e scp "${SSH_ARGS[@]}" /tmp/imds-native-auth-release.tgz "$VPS_USER@$VPS_HOST:/tmp/imds-native-auth-release.tgz"
          sshpass -e scp "${SSH_ARGS[@]}" /tmp/imds-bootstrap-admin.sql "$VPS_USER@$VPS_HOST:/tmp/imds-bootstrap-admin.sql"

      - name: Install native auth on VPS
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=20 -o ServerAliveCountMax=20)
          RELEASE_ID="native-auth-${GITHUB_SHA:0:12}"
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" "RELEASE_ID='$RELEASE_ID' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_ROOT=/opt/imds-marketing
          RELEASE_DIR="$APP_ROOT/releases/$RELEASE_ID"
          mkdir -p "$RELEASE_DIR"
          tar -xzf /tmp/imds-native-auth-release.tgz -C "$RELEASE_DIR"
          chown -R imds:imds "$APP_ROOT"

          for migration in \
            20260817170000_native_auth_and_tenant_registration.sql \
            20260817170500_native_auth_google_oauth.sql \
            20260817171000_native_auth_registration_rpc.sql \
            20260817171500_native_auth_onboarding_rpc.sql; do
            docker exec -i imds-postgres psql -v ON_ERROR_STOP=1 -U imds_owner -d imds_marketing < "$RELEASE_DIR/supabase/migrations/$migration"
          done
          docker exec -i imds-postgres psql -v ON_ERROR_STOP=1 -U imds_owner -d imds_marketing < /tmp/imds-bootstrap-admin.sql

          set -a
          . /etc/imds-postgres.env
          set +a
          test -n "${LOCAL_SERVICE_ROLE_KEY:-}"
          touch /etc/imds-marketing.env
          sed -i '/^IMDS_LOCAL_DB_URL=/d;/^IMDS_LOCAL_SERVICE_ROLE_KEY=/d' /etc/imds-marketing.env
          printf '\nIMDS_LOCAL_DB_URL=http://127.0.0.1:3002\nIMDS_LOCAL_SERVICE_ROLE_KEY=%s\n' "$LOCAL_SERVICE_ROLE_KEY" >> /etc/imds-marketing.env
          chmod 600 /etc/imds-marketing.env

          cd "$RELEASE_DIR"
          npm install --no-audit --no-fund
          ln -sfn "$RELEASE_DIR" "$APP_ROOT/current"
          install -m 0644 "$RELEASE_DIR/deploy/vps/imds-marketing.service" /etc/systemd/system/imds-marketing.service
          install -m 0644 "$RELEASE_DIR/deploy/vps/nginx-imds-marketing.conf" /etc/nginx/sites-available/imds-marketing
          ln -sfn /etc/nginx/sites-available/imds-marketing /etc/nginx/sites-enabled/imds-marketing
          rm -f /etc/nginx/sites-enabled/default
          nginx -t
          systemctl daemon-reload
          systemctl restart nginx
          systemctl restart imds-marketing
          rm -f /tmp/imds-bootstrap-admin.sql /tmp/imds-native-auth-release.tgz
          REMOTE

      - name: Verify native auth runtime
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            if body="$(curl --fail --silent --show-error --max-time 10 "http://$VPS_HOST/api/auth/config")"; then
              echo "$body" | grep -q '"nativeAuth":true'
              echo 'Native auth runtime is active on VPS.'
              exit 0
            fi
            sleep 3
          done
          echo 'Native auth verification failed.'
          exit 1
