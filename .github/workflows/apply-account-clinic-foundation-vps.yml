name: Apply Account Clinic Foundation VPS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260818033500_account_organization_clinic_foundation.sql'
      - 'supabase/migrations/20260818035000_account_clinic_runtime_flows.sql'
      - 'supabase/migrations/20260818044500_team_invitations_roles.sql'
      - 'supabase/migrations/20260818045000_team_admin_rpcs.sql'
      - 'supabase/migrations/20260818050000_notification_center.sql'
      - 'supabase/migrations/20260818061000_clinic_timezone.sql'
      - 'supabase/migrations/20260818063500_billing_control_plane.sql'
      - '.github/workflows/apply-account-clinic-foundation-vps.yml'
      - '.github/workflows/publish-runtime-status.yml'

permissions:
  contents: read

concurrency:
  group: apply-account-clinic-foundation-vps
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - name: Validate deployment access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo 'VPS_HOST secret is missing'; exit 1; }
          test -n "$VPS_USER" || { echo 'VPS_USER secret is missing'; exit 1; }
          test -n "$VPS_PASSWORD" || { echo 'VPS_PASSWORD secret is missing'; exit 1; }
          command -v sshpass >/dev/null || { echo 'sshpass is unavailable on the runner'; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload migrations
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          for migration in \
            20260818033500_account_organization_clinic_foundation.sql \
            20260818035000_account_clinic_runtime_flows.sql \
            20260818044500_team_invitations_roles.sql \
            20260818045000_team_admin_rpcs.sql \
            20260818050000_notification_center.sql \
            20260818061000_clinic_timezone.sql \
            20260818063500_billing_control_plane.sql
          do
            sshpass -e scp "${SSH_ARGS[@]}" "supabase/migrations/$migration" "$VPS_USER@$VPS_HOST:/tmp/$migration"
          done

      - name: Apply and verify migrations
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          docker inspect imds-postgres >/dev/null
          for migration in \
            /tmp/20260818033500_account_organization_clinic_foundation.sql \
            /tmp/20260818035000_account_clinic_runtime_flows.sql \
            /tmp/20260818044500_team_invitations_roles.sql \
            /tmp/20260818045000_team_admin_rpcs.sql \
            /tmp/20260818050000_notification_center.sql \
            /tmp/20260818061000_clinic_timezone.sql \
            /tmp/20260818063500_billing_control_plane.sql
          do
            test -s "$migration"
            docker exec -i imds-postgres psql -U imds_owner -d imds_marketing -v ON_ERROR_STOP=1 < "$migration"
          done

          organization_table=$(docker exec imds-postgres psql -U imds_owner -d imds_marketing -At -c "select (to_regclass('public.imds_organizations') is not null)::int")
          organization_column=$(docker exec imds-postgres psql -U imds_owner -d imds_marketing -At -c "select (exists(select 1 from information_schema.columns where table_schema='public' and table_name='crm_companies' and column_name='organization_id'))::int")
          timezone_column=$(docker exec imds-postgres psql -U imds_owner -d imds_marketing -At -c "select (exists(select 1 from information_schema.columns where table_schema='public' and table_name='crm_companies' and column_name='timezone' and is_nullable='NO'))::int")
          timezone_missing=$(docker exec imds-postgres psql -U imds_owner -d imds_marketing -At -c "select count(*) from public.crm_companies where timezone is null or btrim(timezone) = ''")
          create_rpc=$(docker exec imds-postgres psql -U imds_owner -d imds_marketing -At -c "select (to_regprocedure('public.imds_create_clinic(uuid,text,text,uuid)') is not null)::int")
          join_rpc=$(docker exec imds-postgres psql -U imds_owner -d imds_marketing -At -c "select (to_regprocedure('public.imds_join_clinic(uuid,text)') is not null)::int")
          ownership_rpc=$(docker exec imds-postgres psql -U imds_owner -d imds_marketing -At -c "select (to_regprocedure('public.imds_transfer_company_ownership(uuid,uuid,uuid,boolean)') is not null)::int")
          invitations_table=$(docker exec imds-postgres psql -U imds_owner -d imds_marketing -At -c "select (to_regclass('public.crm_company_invitations') is not null)::int")
          notifications_table=$(docker exec imds-postgres psql -U imds_owner -d imds_marketing -At -c "select (to_regclass('public.crm_notifications') is not null)::int")
          billing_plans_table=$(docker exec imds-postgres psql -U imds_owner -d imds_marketing -At -c "select (to_regclass('public.imds_billing_plans') is not null)::int")
          billing_orders_table=$(docker exec imds-postgres psql -U imds_owner -d imds_marketing -At -c "select (to_regclass('public.imds_billing_orders') is not null)::int")
          billing_subscriptions_table=$(docker exec imds-postgres psql -U imds_owner -d imds_marketing -At -c "select (to_regclass('public.imds_billing_subscriptions') is not null)::int")
          billing_addons_table=$(docker exec imds-postgres psql -U imds_owner -d imds_marketing -At -c "select (to_regclass('public.imds_billing_addon_grants') is not null)::int")
          billing_plan_count=$(docker exec imds-postgres psql -U imds_owner -d imds_marketing -At -c "select count(*) from public.imds_billing_plans where product='marketing' and active")
          operator_role=$(docker exec imds-postgres psql -U imds_owner -d imds_marketing -At -c "select (exists(select 1 from pg_constraint where conrelid='public.crm_company_members'::regclass and contype='c' and pg_get_constraintdef(oid) like '%operator%'))::int")
          orphan_count=$(docker exec imds-postgres psql -U imds_owner -d imds_marketing -At -c "select count(*) from public.crm_companies where organization_id is null")

          test "$organization_table" = "1" || { echo 'imds_organizations missing'; exit 1; }
          test "$organization_column" = "1" || { echo 'organization_id missing'; exit 1; }
          test "$timezone_column" = "1" || { echo 'clinic timezone missing or nullable'; exit 1; }
          test "$timezone_missing" = "0" || { echo "clinics without timezone: $timezone_missing"; exit 1; }
          test "$create_rpc" = "1" || { echo 'imds_create_clinic missing'; exit 1; }
          test "$join_rpc" = "1" || { echo 'imds_join_clinic missing'; exit 1; }
          test "$ownership_rpc" = "1" || { echo 'ownership transfer RPC missing'; exit 1; }
          test "$invitations_table" = "1" || { echo 'crm_company_invitations missing'; exit 1; }
          test "$notifications_table" = "1" || { echo 'crm_notifications missing'; exit 1; }
          test "$billing_plans_table" = "1" || { echo 'imds_billing_plans missing'; exit 1; }
          test "$billing_orders_table" = "1" || { echo 'imds_billing_orders missing'; exit 1; }
          test "$billing_subscriptions_table" = "1" || { echo 'imds_billing_subscriptions missing'; exit 1; }
          test "$billing_addons_table" = "1" || { echo 'imds_billing_addon_grants missing'; exit 1; }
          test "$billing_plan_count" -ge "3" || { echo 'BELES billing catalog missing'; exit 1; }
          test "$operator_role" = "1" || { echo 'expanded membership role constraint missing'; exit 1; }
          test "$orphan_count" = "0" || { echo "clinics without organization: $orphan_count"; exit 1; }
          echo 'ACCOUNT_CLINIC_TEAM_NOTIFICATION_TIMEZONE_BILLING_SCHEMA=ok'
          rm -f /tmp/20260818033500_account_organization_clinic_foundation.sql /tmp/20260818035000_account_clinic_runtime_flows.sql /tmp/20260818044500_team_invitations_roles.sql /tmp/20260818045000_team_admin_rpcs.sql /tmp/20260818050000_notification_center.sql /tmp/20260818061000_clinic_timezone.sql /tmp/20260818063500_billing_control_plane.sql
          REMOTE

      - name: Cleanup
        if: always()
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set +e
          export SSHPASS
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" 'rm -f /tmp/20260818033500_account_organization_clinic_foundation.sql /tmp/20260818035000_account_clinic_runtime_flows.sql /tmp/20260818044500_team_invitations_roles.sql /tmp/20260818045000_team_admin_rpcs.sql /tmp/20260818050000_notification_center.sql /tmp/20260818061000_clinic_timezone.sql /tmp/20260818063500_billing_control_plane.sql' || true
