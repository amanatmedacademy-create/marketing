name: Apply Branch Hierarchy VPS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260818104500_branch_hierarchy.sql'
      - 'supabase/migrations/20260818115500_branch_operational_scope.sql'
      - 'supabase/migrations/20260818115600_branch_integration_keys.sql'
      - 'supabase/migrations/20260818124500_integration_branch_routing.sql'
      - '.github/workflows/apply-branch-hierarchy-vps.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: apply-branch-hierarchy-vps
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - name: Publish schema pending status
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -euo pipefail
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"pending\",\"context\":\"imds/branch-schema\",\"description\":\"Applying branch routing schema\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" >/dev/null
      - name: Validate deployment access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo 'VPS_HOST secret is missing'; exit 1; }
          test -n "$VPS_USER" || { echo 'VPS_USER secret is missing'; exit 1; }
          test -n "$VPS_PASSWORD" || { echo 'VPS_PASSWORD secret is missing'; exit 1; }
          command -v sshpass >/dev/null
      - uses: actions/checkout@v4
      - name: Upload migrations
        shell: bash
        env: { SSHPASS: '${{ secrets.VPS_PASSWORD }}' }
        run: |
          set -euo pipefail
          export SSHPASS
          for migration in 20260818104500_branch_hierarchy.sql 20260818115500_branch_operational_scope.sql 20260818115600_branch_integration_keys.sql 20260818124500_integration_branch_routing.sql; do
            sshpass -e scp -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "supabase/migrations/$migration" "$VPS_USER@$VPS_HOST:/tmp/$migration"
          done
      - name: Apply and verify
        shell: bash
        env: { SSHPASS: '${{ secrets.VPS_PASSWORD }}' }
        run: |
          set -euo pipefail
          export SSHPASS
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          for migration in /tmp/20260818104500_branch_hierarchy.sql /tmp/20260818115500_branch_operational_scope.sql /tmp/20260818115600_branch_integration_keys.sql /tmp/20260818124500_integration_branch_routing.sql; do
            test -s "$migration"
            docker exec -i imds-postgres psql -U imds_owner -d imds_marketing -v ON_ERROR_STOP=1 < "$migration"
          done
          branches=$(docker exec imds-postgres psql -U imds_owner -d imds_marketing -At -c "select (to_regclass('public.crm_branches') is not null)::int")
          members=$(docker exec imds-postgres psql -U imds_owner -d imds_marketing -At -c "select (to_regclass('public.crm_branch_members') is not null)::int")
          missing_primary=$(docker exec imds-postgres psql -U imds_owner -d imds_marketing -At -c "select count(*) from public.crm_companies c where not exists (select 1 from public.crm_branches b where b.company_id=c.id and b.is_primary=true and b.status<>'archived')")
          for table in marketing_leads crm_tasks integration_credentials marketing_calls marketing_conversations marketing_messages marketing_daily_metrics marketing_ads; do
            exists=$(docker exec imds-postgres psql -U imds_owner -d imds_marketing -At -c "select (to_regclass('public.$table') is not null)::int")
            if [ "$exists" = 1 ]; then
              column=$(docker exec imds-postgres psql -U imds_owner -d imds_marketing -At -c "select (exists(select 1 from information_schema.columns where table_schema='public' and table_name='$table' and column_name='branch_id'))::int")
              test "$column" = 1 || { echo "$table.branch_id missing"; exit 1; }
              unscoped=$(docker exec imds-postgres psql -U imds_owner -d imds_marketing -At -c "select count(*) from public.$table where company_id is not null and branch_id is null")
              test "$unscoped" = 0 || { echo "$table has $unscoped unscoped rows"; exit 1; }
            fi
          done
          integration_key=$(docker exec imds-postgres psql -U imds_owner -d imds_marketing -At -c "select (to_regclass('public.integration_credentials_company_branch_provider_uidx') is not null)::int")
          validator=$(docker exec imds-postgres psql -U imds_owner -d imds_marketing -At -c "select (to_regprocedure('public.imds_assign_validate_branch()') is not null)::int")
          route_claims=$(docker exec imds-postgres psql -U imds_owner -d imds_marketing -At -c "select (to_regclass('public.imds_integration_route_claims') is not null)::int")
          route_resolver=$(docker exec imds-postgres psql -U imds_owner -d imds_marketing -At -c "select (to_regprocedure('public.imds_current_route_claim_branch(uuid)') is not null)::int")
          integration_events_branch=$(docker exec imds-postgres psql -U imds_owner -d imds_marketing -At -c "select case when to_regclass('public.integration_events') is null then 1 else (exists(select 1 from information_schema.columns where table_schema='public' and table_name='integration_events' and column_name='branch_id'))::int end")
          test "$branches" = 1
          test "$members" = 1
          test "$missing_primary" = 0
          test "$integration_key" = 1
          test "$validator" = 1
          test "$route_claims" = 1
          test "$route_resolver" = 1
          test "$integration_events_branch" = 1
          echo 'BRANCH_ROUTING_SCHEMA=ok'
          rm -f /tmp/20260818104500_branch_hierarchy.sql /tmp/20260818115500_branch_operational_scope.sql /tmp/20260818115600_branch_integration_keys.sql /tmp/20260818124500_integration_branch_routing.sql
          REMOTE
      - name: Publish schema success status
        if: success()
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -euo pipefail
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"success\",\"context\":\"imds/branch-schema\",\"description\":\"Branch routing schema verified\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" >/dev/null
      - name: Publish schema failure status
        if: failure()
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set +e
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"failure\",\"context\":\"imds/branch-schema\",\"description\":\"Branch routing schema failed\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" >/dev/null
