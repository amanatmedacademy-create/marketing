name: Apply Commercial Entitlement Transport
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-commercial-entitlement-transport.py'
      - '.github/workflows/apply-commercial-entitlement-transport.yml'
permissions:
  contents: write
concurrency:
  group: apply-commercial-entitlement-transport
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply transport patch
        run: python3 scripts/patch-commercial-entitlement-transport.py
      - name: Validate Marketing
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Commit transport patch
        run: |
          set -euo pipefail
          git config user.name 'IMDS Automation'
          git config user.email 'automation@imds.local'
          git add server/platformControl.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Commercial entitlement transport already applied'
          else
            git commit -m 'support full commercial entitlement transport'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
