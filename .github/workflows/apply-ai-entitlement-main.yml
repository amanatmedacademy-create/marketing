name: Apply AI Entitlement Main
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-ai-entitlement-main.py'
      - '.github/workflows/apply-ai-entitlement-main.yml'
permissions:
  contents: write
concurrency:
  group: apply-ai-entitlement-main
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply AI entitlement patch
        run: python3 scripts/apply-ai-entitlement-main.py
      - name: Validate Marketing
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run lint
          npm run build
      - name: Commit to main
        run: |
          set -euo pipefail
          git config user.name 'IMDS Automation'
          git config user.email 'automation@imds.local'
          git add src/MarketingPlatform.tsx
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No AI entitlement changes to commit'
          else
            git commit -m 'separate IMDS AI commercial entitlement'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
