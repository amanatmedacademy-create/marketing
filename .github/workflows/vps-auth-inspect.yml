name: VPS Auth Inspect

on:
  push:
    branches: [main]
    paths: ['.github/workflows/vps-auth-inspect.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - name: Validate VPS access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_PASSWORD"

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Inspect password hash format
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            docker exec imds-postgres psql -U imds_owner -d imds_marketing -AtF "|" -c "select split_part(p.password_hash,\$\$\$\$,1),split_part(p.password_hash,\$\$\$\$,2),length(split_part(p.password_hash,\$\$\$\$,3)),length(split_part(p.password_hash,\$\$\$\$,4)),array_length(string_to_array(p.password_hash,\$\$\$\$),1) from imds_auth_passwords p join imds_auth_users u on u.id=p.user_id where lower(u.email)=lower(\$\$admin@imds.kz\$\$);"
          '
