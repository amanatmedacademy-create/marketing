name: VPS Auth Inspect

on:
  push:
    branches: [main]
    paths: ['.github/workflows/vps-auth-inspect.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - name: Validate VPS access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_PASSWORD"

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Inspect admin auth record
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            echo "=== auth user ==="
            docker exec imds-postgres psql -U imds_owner -d imds_marketing -AtF "|" -c "select u.id,u.email,u.status,u.email_verified,coalesce(p.user_id is not null,false) as has_password,coalesce(string_agg(distinct i.provider,','),'') as providers from imds_auth_users u left join imds_auth_passwords p on p.user_id=u.id left join imds_auth_identities i on i.user_id=u.id where lower(u.email)=lower('admin@imds.kz') group by u.id,u.email,u.status,u.email_verified,p.user_id;"
            echo "=== marketing user and memberships ==="
            docker exec imds-postgres psql -U imds_owner -d imds_marketing -AtF "|" -c "select mu.id,mu.email,mu.role,mu.status,cm.company_id,cm.role,cm.status from marketing_users mu left join crm_company_members cm on cm.user_id=mu.id where lower(mu.email)=lower('admin@imds.kz') order by cm.created_at nulls last;"
            echo "=== auth table counts ==="
            docker exec imds-postgres psql -U imds_owner -d imds_marketing -AtF "|" -c "select (select count(*) from imds_auth_users),(select count(*) from imds_auth_passwords),(select count(*) from imds_auth_sessions);"
            echo "=== endpoint ==="
            curl -fsS http://127.0.0.1:8787/api/auth/config
            echo
          '
