name: DB Diagnostics

on:
  push:
    branches: [agent/selfhosted-postgres-migration]
    paths: ['.github/workflows/db-diagnostics.yml']

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Check database bootstrap state
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" '
            echo "=== bootstrap tree ==="
            ps -eo pid,ppid,stat,etime,cmd --forest | grep -A12 -B2 -E "bootstrap-db|dockerd|containerd|docker compose|docker-compose" | head -n 80 || true
            echo "=== docker service ==="
            systemctl --no-pager --full status docker containerd 2>/dev/null | tail -n 60 || true
            echo "=== docker cli ==="
            docker version 2>&1 || true
            docker compose version 2>&1 || true
            docker-compose version 2>&1 || true
            echo "=== containers ==="
            docker ps -a 2>&1 || true
            echo "=== migrations ==="
            docker exec imds-postgres psql -U imds_owner -d imds_marketing -Atqc "select count(*), coalesce(max(filename), chr(45)) from public.imds_schema_migrations" 2>/dev/null || true
          '
