name: Diagnose AI Entitlement Main
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-ai-entitlement-main.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate and probe
        shell: bash
        run: |
          set +e
          : > /tmp/diag.log
          npm install --no-audit --no-fund >>/tmp/diag.log 2>&1
          rc=$?
          if [ $rc -eq 0 ]; then npm run typecheck >>/tmp/diag.log 2>&1; rc=$?; fi
          if [ $rc -eq 0 ]; then npm run build >>/tmp/diag.log 2>&1; rc=$?; fi
          if [ $rc -eq 0 ]; then
            grep -q "platformModule: 'marketing.ai'" src/MarketingPlatform.tsx || rc=1
            grep -q "<MarketingAiPage/>, 'marketing.ai'" src/MarketingPlatform.tsx || rc=1
          fi
          if [ $rc -eq 0 ]; then
            sudo apt-get update >/dev/null 2>&1 && sudo apt-get install -y sshpass >/dev/null 2>&1
            export SSHPASS="$VPS_PASSWORD"
            sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" 'sudo bash -s' >>/tmp/diag.log 2>&1 <<'REMOTE'
          set -euo pipefail
          systemctl is-active --quiet imds-marketing.service
          curl -fsS --max-time 10 http://127.0.0.1:8787/api/health >/dev/null
          CURRENT="$(readlink -f /opt/imds-marketing/current)"
          test -n "$CURRENT"
          grep -q "platformModule: 'marketing.ai'" "$CURRENT/src/MarketingPlatform.tsx"
          grep -q "<MarketingAiPage/>, 'marketing.ai'" "$CURRENT/src/MarketingPlatform.tsx"
          REMOTE
            rc=$?
          fi
          mkdir -p docs/internal
          if [ $rc -eq 0 ]; then status=passed; else status=failed; fi
          { echo "marketing_ai_diagnostic=$status"; echo "head=$GITHUB_SHA"; echo '--- tail ---'; tail -80 /tmp/diag.log; } > docs/internal/marketing-ai-diagnostic.txt
          git config user.name 'IMDS Automation'
          git config user.email 'automation@imds.local'
          git add docs/internal/marketing-ai-diagnostic.txt
          git commit -m "record Marketing AI diagnostic $status" || true
          git pull --rebase origin main
          git push origin HEAD:main
          exit 0
