name: Inspect Marketing Data State

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vps-marketing-data-state.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - name: Prepare secure migration token on VPS
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          command -v sshpass >/dev/null
          export SSHPASS
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          TOKEN_FILE=/root/.imds-legacy-migration-token
          if [ ! -s "$TOKEN_FILE" ]; then
            umask 077
            openssl rand -hex 48 > "$TOKEN_FILE"
          fi
          chmod 600 "$TOKEN_FILE"
          HASH="$(sha256sum "$TOKEN_FILE" | awk '{print $1}')"
          echo "MIGRATION_TOKEN_SHA256=$HASH"
          echo 'MIGRATION_TOKEN_READY=yes'
          REMOTE
