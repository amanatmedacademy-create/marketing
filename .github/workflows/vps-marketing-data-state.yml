name: Inspect Marketing Data State

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vps-marketing-data-state.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - name: Inspect safe Marketing recovery metadata
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          command -v sshpass >/dev/null
          export SSHPASS
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          DB=(docker exec imds-postgres psql -U imds_owner -d imds_marketing -At)
          COMPANY_ID='4cd22020-6f1d-4afb-9266-b01c96e4a927'

          echo "RELEASE=$(readlink -f /var/www/imds-marketing/current 2>/dev/null || true)"
          echo 'ENV_NAMES:'
          sed -n 's/^\([A-Z0-9_][A-Z0-9_]*\)=.*/\1/p' /etc/imds-marketing.env | sort | grep -E '^(APP_ORIGIN|DEFAULT_COMPANY_ID|IMDS_|INTEGRATION_|META_|SUPABASE_|VITE_SUPABASE_)' || true

          echo 'TABLE_COUNTS:'
          for table in marketing_ads marketing_campaigns marketing_tasks marketing_content_plan marketing_automations marketing_automation_runs marketing_lead_forms marketing_tracking_links marketing_media_plan marketing_activity_log marketing_leads marketing_daily_metrics marketing_calls integration_credentials integration_runs; do
            exists="$("${DB[@]}" -c "select case when to_regclass('public.$table') is null then 0 else 1 end")"
            if [ "$exists" = '1' ]; then
              count="$("${DB[@]}" -c "select count(*) from public.$table")"
              echo "$table=$count"
            else
              echo "$table=MISSING"
            fi
          done

          echo 'RECOVERY_FILES:'
          find /opt /var/backups /var/lib /root /etc -xdev -type f \
            \( -iname '*marketing*.sql' -o -iname '*marketing*.dump' -o -iname '*marketing*.backup' -o -iname '*supabase*.sql' -o -iname '*postgres*.dump' -o -iname '*postgres*.backup' -o -iname 'imds-marketing.env*' \) \
            -printf '%p|%s|%TY-%Tm-%TdT%TH:%TM:%TS\n' 2>/dev/null | sort | head -200 || true

          echo 'POSSIBLE_ENV_BACKUPS_NAMES_ONLY:'
          for file in $(find /etc /root /opt -xdev -type f \( -name 'imds-marketing.env*' -o -name '.env*' \) 2>/dev/null | head -100); do
            echo "FILE=$file"
            sed -n 's/^\([A-Z0-9_][A-Z0-9_]*\)=.*/\1/p' "$file" 2>/dev/null | sort | grep -E '^(SUPABASE_|VITE_SUPABASE_|META_|INTEGRATION_|IMDS_)' || true
          done

          echo 'DOCKER_VOLUMES:'
          docker volume ls --format '{{.Name}}' | grep -Ei 'imds|postgres|supabase|marketing' || true

          echo 'SYSTEMD_BACKUP_UNITS:'
          systemctl list-unit-files --type=service --type=timer 2>/dev/null | grep -Ei 'imds|postgres|backup|marketing' || true
          REMOTE
