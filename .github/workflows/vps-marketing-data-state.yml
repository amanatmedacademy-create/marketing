name: Inspect Marketing Data State

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vps-marketing-data-state.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check legacy migration credentials safely
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ] && echo 'SUPABASE_SERVICE_ROLE_KEY=present' || echo 'SUPABASE_SERVICE_ROLE_KEY=absent'
          [ -n "${VITE_SUPABASE_ANON_KEY:-}" ] && echo 'VITE_SUPABASE_ANON_KEY=present' || echo 'VITE_SUPABASE_ANON_KEY=absent'
          [ -n "${SUPABASE_ANON_KEY:-}" ] && echo 'SUPABASE_ANON_KEY=present' || echo 'SUPABASE_ANON_KEY=absent'
