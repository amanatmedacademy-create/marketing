name: Deploy Analytics Platform

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apps/api/**','apps/sync-worker/**','infra/k8s/**']

permissions: { contents: read, packages: write }

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: marketing-api, dockerfile: apps/api/Dockerfile }
          - { name: marketing-sync-worker, dockerfile: apps/sync-worker/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure cluster
        env: { KUBE_CONFIG_DATA: '${{ secrets.KUBE_CONFIG_DATA }}' }
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_DATA" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - run: kubectl apply -f infra/k8s/analytics-platform.yaml
      - run: kubectl -n imds-marketing set image deployment/marketing-api api=ghcr.io/${{ github.repository_owner }}/marketing-api:${{ github.sha }}
      - run: kubectl -n imds-marketing set image deployment/connector-sync-worker worker=ghcr.io/${{ github.repository_owner }}/marketing-sync-worker:${{ github.sha }}
      - run: kubectl -n imds-marketing rollout status deployment/marketing-api --timeout=5m
      - run: kubectl -n imds-marketing rollout status deployment/connector-sync-worker --timeout=5m
