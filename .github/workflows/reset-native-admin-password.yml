name: Reset Native Admin Password

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reset-native-admin-password.yml'

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - name: Validate VPS access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_PASSWORD"

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Reset temporary admin password
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" "docker exec imds-postgres psql -v ON_ERROR_STOP=1 -U imds_owner -d imds_marketing -c \"update public.imds_auth_passwords p set password_hash='pbkdf2_sha256\$600000\$DqEndiXfI4NG_aEtwIsWCcksfBBXAsDG\$gwTuTPyGIu3lypvKXH3beFegW1tN11irohKbT5UQzNk', updated_at=now() from public.imds_auth_users u where p.user_id=u.id and lower(u.email)='admin@imds.kz';\""

      - name: Verify admin credential row
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          COUNT="$(sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" "docker exec imds-postgres psql -U imds_owner -d imds_marketing -Atqc \"select count(*) from public.imds_auth_passwords p join public.imds_auth_users u on u.id=p.user_id where lower(u.email)='admin@imds.kz' and p.password_hash like 'pbkdf2_sha256\$600000\$%';\"")"
          test "$COUNT" = "1"
          echo "Temporary admin password hash updated successfully."
