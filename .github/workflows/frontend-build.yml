name: Frontend Build

on:
  push:
    branches:
      - main
      - agent/frontend-rebuild
      - agent/harden-main-build-config
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install

      - name: TypeScript checks
        run: bun run typecheck

      - name: Vite production build
        run: bun run build

      - name: Verify dist
        run: |
          test -d dist
          test -f dist/index.html
          find dist -maxdepth 2 -type f -print

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7
